<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI E-Commerce Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Lock screen */
        body { font-family: 'Outfit', sans-serif; overflow: hidden; height: 100vh; width: 100vw; }

        /* Sky Blue Animated Background */
        .bg-sky-theme {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
            background-size: 200% 200%;
            animation: gradientMove 12s ease infinite;
        }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* STARS BACKGROUND */
        .bg-star { position: absolute; color: #fde047; animation: twinkleStar linear infinite alternate; z-index: 0; opacity: 0; pointer-events: none; }
        @keyframes twinkleStar { 0% { opacity: 0; transform: scale(0.5) rotate(0deg); } 50% { opacity: 0.8; transform: scale(1.3) rotate(45deg); } 100% { opacity: 0; transform: scale(0.5) rotate(90deg); } }
        .dur-3 { animation-duration: 3s; } .dur-4 { animation-duration: 4.5s; } .dur-5 { animation-duration: 6s; }
        .delay-1 { animation-delay: 0.5s; } .delay-2 { animation-delay: 1.5s; } .delay-3 { animation-delay: 2.5s; }

        /* Glassmorphism Styles */
        .glass-box {
            background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.9); box-shadow: 0 15px 50px rgba(14, 165, 233, 0.2); border-radius: 24px;
        }
        
        .glass-input {
            background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.8); color: #1e3a8a; transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.9); border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); outline: none; transform: translateY(-1px);
        }
        .glass-input::placeholder { color: #64748b; font-weight: 400; }

        .pure-glass-btn {
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 32px rgba(14, 165, 233, 0.15); border-radius: 99px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pure-glass-btn:hover {
            transform: translateY(-3px) scale(1.02); background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 40px rgba(56, 189, 248, 0.5); border-color: #7dd3fc; color: #0284c7;
        }

        /* Animations */
        .animate-pulse-slow { animation: pulseSlow 4s infinite; }
        @keyframes pulseSlow { 0%, 100% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 10px rgba(14,165,233,0.5)); } }
        
        .slide-up { animation: slideUp 0.8s ease-out forwards; }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-sky-theme flex flex-col items-center justify-center p-4 relative">

    <i class="fas fa-star text-sm bg-star dur-3 delay-1" style="top: 15%; left: 20%;"></i>
    <i class="fas fa-star text-lg bg-star dur-5 delay-2" style="top: 25%; left: 80%;"></i>
    <i class="fas fa-star text-xs bg-star dur-4" style="top: 50%; left: 10%;"></i>
    <i class="fas fa-star text-sm bg-star dur-3 delay-3" style="top: 75%; left: 85%;"></i>
    <i class="fas fa-star text-md bg-star dur-5 delay-1" style="top: 85%; left: 30%;"></i>
    <i class="fas fa-star text-lg bg-star dur-4 delay-2" style="top: 10%; left: 60%;"></i>
    <i class="fas fa-star text-xs bg-star dur-3" style="top: 60%; left: 70%;"></i>
    <i class="fas fa-star text-md bg-star dur-5 delay-3" style="top: 40%; left: 25%;"></i>

    <div class="w-full max-w-md mb-6 z-10 slide-up" style="animation-delay: 0.2s; opacity: 0;">
        <a href="/" class="inline-flex items-center px-4 py-2 bg-white/40 backdrop-blur-md border border-white/60 rounded-full text-blue-900 font-bold text-sm hover:bg-white/80 hover:shadow-lg hover:-translate-y-1 transition-all duration-300">
            <i class="fas fa-arrow-left mr-2 text-sky-600"></i> Back to Engine
        </a>
    </div>

    <div class="glass-box w-full max-w-md overflow-hidden z-10 slide-up p-8 relative">
        
        <div class="text-center mb-8">
            <div class="inline-block p-4 rounded-full bg-white/50 border border-white/80 shadow-inner mb-4 animate-pulse-slow">
                <i class="fas fa-shield-halved text-4xl text-sky-500"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-blue-900 tracking-tight">System Login</h2>
            <p class="text-blue-700 font-medium text-sm mt-2">Enter your credentials to access the AI Engine</p>
        </div>
        
        {% if error %}
        <div class="bg-red-100/80 backdrop-blur-sm border-l-4 border-red-500 text-red-700 p-3 mb-6 rounded-lg text-sm font-bold shadow-sm animate-pulse">
            <i class="fas fa-exclamation-circle mr-2"></i>{{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="bg-emerald-100/80 backdrop-blur-sm border-l-4 border-emerald-500 text-emerald-700 p-3 mb-6 rounded-lg text-sm font-bold shadow-sm">
            <i class="fas fa-check-circle mr-2"></i>{{ success }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-blue-900 text-sm font-extrabold mb-2 ml-1">Email or Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-envelope text-sky-600"></i>
                    </div>
                    <input type="text" name="username" class="glass-input w-full pl-11 pr-4 py-3.5 rounded-xl font-medium" placeholder="Enter your email or username" required>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-2 ml-1">
                    <label class="block text-blue-900 text-sm font-extrabold">Password</label>
                   <a href="/forgot_password" class="text-xs text-sky-600 hover:text-sky-800 font-bold transition-colors">Forgot password?</a>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-lock text-sky-600"></i>
                    </div>
                    <input type="password" name="password" class="glass-input w-full pl-11 pr-4 py-3.5 rounded-xl font-medium" placeholder="Enter your password" required>
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" class="pure-glass-btn w-full text-blue-900 font-extrabold text-lg py-4 flex justify-center items-center group">
                    Login to Dashboard 
                    <i class="fas fa-arrow-right ml-3 text-sky-500 group-hover:translate-x-1 transition-transform"></i>
                </button>
            </div>
        </form>

        <div class="mt-8 text-center text-sm font-medium">
            <p class="text-blue-800">
                Don't have an account? 
                <a href="/register" class="text-sky-600 hover:text-sky-800 hover:underline font-extrabold transition-colors">Register here</a>
            </p>
        </div>
        
    </div>

</body>
</html>
