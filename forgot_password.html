<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AI E-Commerce Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Outfit', sans-serif; overflow: hidden; height: 100vh; width: 100vw; }
        .bg-sky-theme {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
            background-size: 200% 200%;
            animation: gradientMove 12s ease infinite;
        }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .glass-box {
            background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.9); box-shadow: 0 15px 50px rgba(14, 165, 233, 0.2); border-radius: 24px;
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.8); color: #1e3a8a; transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.9); border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); outline: none; transform: translateY(-1px);
        }
        .pure-glass-btn {
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 32px rgba(14, 165, 233, 0.15); border-radius: 99px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pure-glass-btn:hover {
            transform: translateY(-3px) scale(1.02); background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 40px rgba(56, 189, 248, 0.5); border-color: #7dd3fc; color: #0284c7;
        }
        .slide-up { animation: slideUp 0.8s ease-out forwards; }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-sky-theme flex flex-col items-center justify-center p-4 relative">

    <div class="w-full max-w-md mb-6 z-10 slide-up" style="animation-delay: 0.2s; opacity: 0;">
        <a href="/login" class="inline-flex items-center px-4 py-2 bg-white/40 backdrop-blur-md border border-white/60 rounded-full text-blue-900 font-bold text-sm hover:bg-white/80 hover:shadow-lg hover:-translate-y-1 transition-all duration-300">
            <i class="fas fa-arrow-left mr-2 text-sky-600"></i> Back to Login
        </a>
    </div>

    <div class="glass-box w-full max-w-md overflow-hidden z-10 slide-up p-8 relative">
        
        <div class="text-center mb-6">
            <div class="inline-block p-4 rounded-full bg-white/50 border border-white/80 shadow-inner mb-4">
                <i class="fas fa-key text-4xl text-sky-500"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-blue-900 tracking-tight">Reset Password</h2>
            <p class="text-blue-700 font-medium text-sm mt-2">Verify your identity to set a new password</p>
        </div>
        
        {% if error %}
        <div class="bg-red-100/80 backdrop-blur-sm border-l-4 border-red-500 text-red-700 p-3 mb-6 rounded-lg text-sm font-bold shadow-sm">
            <i class="fas fa-exclamation-circle mr-2"></i>{{ error }}
        </div>
        {% endif %}

        <form action="/forgot_password" method="POST" class="space-y-4">
            
            <div>
                <label class="block text-blue-900 text-sm font-extrabold mb-1 ml-1">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-user text-sky-600"></i>
                    </div>
                    <input type="text" name="username" class="glass-input w-full pl-11 pr-4 py-3 rounded-xl font-medium" placeholder="Your assigned username" required>
                </div>
            </div>

            <div>
                <label class="block text-blue-900 text-sm font-extrabold mb-1 ml-1">Registered Email</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-envelope text-sky-600"></i>
                    </div>
                    <input type="email" name="email" class="glass-input w-full pl-11 pr-4 py-3 rounded-xl font-medium" placeholder="your@email.com" required>
                </div>
            </div>

            <div>
                <label class="block text-blue-900 text-sm font-extrabold mb-1 ml-1">New Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-lock text-sky-600"></i>
                    </div>
                    <input type="password" name="new_password" class="glass-input w-full pl-11 pr-4 py-3 rounded-xl font-medium" 
                           placeholder="Min 6 chars (letters & numbers)" 
                           required minlength="6" pattern="(?=.*[A-Za-z])(?=.*\d).{6,}">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" class="pure-glass-btn w-full text-blue-900 font-extrabold text-lg py-3 flex justify-center items-center group">
                    Update Password 
                    <i class="fas fa-check-circle ml-3 text-sky-500 group-hover:scale-110 transition-transform"></i>
                </button>
            </div>
        </form>
    </div>

</body>
</html>
